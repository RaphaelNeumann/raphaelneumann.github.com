<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raphael Neumann</title>
  <meta name="description" content="Relacionamento cristão, fé e vida com propósito. Marido da Ana e pai da Eleonora.">
  <meta property="og:title" content="Raphael Neumann">
  <meta property="og:description" content="Relacionamento cristão, fé e vida com propósito.">
  <meta property="og:url" content="https://rneumann.me/">
  <style>
    :root {
      --bg: #faf8f5; --text: #1f1f1f; --muted: #6b6b6b;
      --card: #ffffff; --line: #e6e1da; --accent: #486c81;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161616; --text: #f1f1f1; --muted: #a3a3a3;
              --card: #222222; --line: #333333; --accent: #8fb3c8; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 16px;
    }
    main { width: 100%; max-width: 440px; text-align: center; }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    .bio { color: var(--muted); margin: 8px 0 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .links a {
      display: block; padding: 16px 20px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--line);
      color: var(--text); text-decoration: none; font-weight: 600;
    }
    .links a small { display: block; font-weight: 400; color: var(--muted); font-size: 0.875rem; margin-top: 2px; }
    .links a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .links a.primary small { color: rgba(255,255,255,0.85); }
    .links a:hover { filter: brightness(0.97); }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.8125rem; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Raphael Neumann</h1>
    <p class="bio">Relacionamento cristão, fé e vida com propósito.<br>Marido da Ana e pai da Eleonora.</p>

    <nav class="links">
      <a class="primary" href="https://instagram.com/RaphaelNeumann">
        Instagram
        <small>@RaphaelNeumann</small>
      </a>
      <a href="/eleicao/">
        A conta do 2º turno
        <small>Infográfico interativo com os números do TSE</small>
      </a>
    </nav>

    <footer><a href="mailto:raphael@rneumann.me">raphael@rneumann.me</a></footer>
  </main>
</body>
</html>
